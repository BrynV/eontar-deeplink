<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UGoNext</title>
<meta name="robots" content="noindex">
<style>
  body { font-family: -apple-system, sans-serif; background: #0A1128; color: #fff; margin: 0;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
  .card { padding: 24px; max-width: 420px; }
  h1 { font-size: 1.4rem; letter-spacing: 0.05em; }
  h1 .sub { display: block; font-size: 0.85rem; letter-spacing: 0.05em; color: #ccc; margin-top: 4px; }
  p { color: #ccc; line-height: 1.5; }
  a { color: #FF9F1C; }
  .play-btn {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 28px;
    background: #FF9F1C;
    color: #0A1128;
    font-weight: bold;
    letter-spacing: 0.03em;
    text-decoration: none;
    border-radius: 4px;
  }
  .code-fallback { font-size: 0.8rem; color: #999; margin-top: 24px; }
</style>
</head>
<body>
<div class="card">
  <h1>UGoNext</h1>
  <p id="msg">This link opens in the UGoNext app.</p>
  <a id="playBtn" class="play-btn" href="https://play.google.com/store/apps/details?id=com.eontar.eontar_app" >GET IT ON GOOGLE PLAY</a>
  <p id="codeFallback" class="code-fallback" style="display:none"></p>
  <p><a href="https://eontar.co.uk">Visit eontar.co.uk</a></p>
</div>

</body>
</html>
